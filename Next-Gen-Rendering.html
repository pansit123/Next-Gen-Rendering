<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment #3 : Next Gen Rendering - Robot Army Amusement Park</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #05050a;
        }
    </style>
</head>
<body>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GUI } from 'three/addons/libs/lil-gui.module.min.js';

        let scene, camera, renderer, controls;
        let commanderRobot, modelPBRMaterial, armyPBRMaterial, dirLight;
        let bgShaderMaterial, grassMaterial;
        let ferrisWheelGroup, carouselGroup;
        const armyMembers = [];
        const ferrisCars = [];

       
        const bgVertexShader = `
            varying vec2 vUv;
            void main() {
                vUv = uv;
                gl_Position = vec4(position, 1.0);
            }
        `;

        const bgFragmentShader = `
            uniform float uTime;
            uniform vec3 uColorSkyTop;
            uniform vec3 uColorSkyBottom;
            uniform vec3 uNeonGlow;
            varying vec2 vUv;

            // Pseudo-random function for stars
            float hash(vec2 p) {
                p = fract(p * vec2(123.34, 456.21));
                p += dot(p, p + 45.32);
                return fract(p.x * p.y);
            }

            void main() {
                // Gradient Sky (ท้องฟ้าคืนสวนสนุก)
                vec3 sky = mix(uColorSkyBottom, uColorSkyTop, vUv.y);

                // คลื่นแสงออโรรานีออนลอยบนฟ้า
                float wave = sin(vUv.x * 6.0 + uTime * 1.2) * 0.05 + cos(vUv.y * 5.0 - uTime * 0.8) * 0.05;
                vec2 center = vec2(0.5, 0.5) + vec2(wave, 0.0);
                float dist = distance(vUv, center);
                float glow = smoothstep(0.6, 0.0, dist) * 0.4;

                // ดาวระยิบระยับ
                vec2 grid = floor(vUv * 150.0);
                float star = hash(grid);
                float starGlow = 0.0;
                if (star > 0.985) {
                    starGlow = sin(uTime * 5.0 + star * 100.0) * 0.5 + 0.5;
                }

                // แสงขอบฟ้าสวนสนุก (Horizon Fog)
                float horizon = smoothstep(0.0, 0.35, vUv.y) * smoothstep(0.7, 0.1, vUv.y);
                vec3 horizonLight = vec3(0.9, 0.1, 0.5) * horizon * 0.4;

                vec3 finalColor = sky + (uNeonGlow * glow) + vec3(starGlow) + horizonLight;
                gl_FragColor = vec4(finalColor, 1.0);
            }
        `;

       
        const grassVertexShader = `
            varying vec2 vUv;
            varying vec3 vNormal;
            varying vec3 vWorldPos;
            uniform float uTime;

            void main() {
                vUv = uv;
                vNormal = normalMatrix * normal;
                
                vec3 pos = position;
                float wave = sin(uTime * 4.0 + instanceMatrix[3][0] * 0.6 + instanceMatrix[3][2] * 0.6) * 0.2;
                if (uv.y > 0.2) {
                    pos.x += wave * uv.y;
                    pos.z += wave * 0.5 * uv.y;
                }

                vec4 worldPosition = instanceMatrix * vec4(pos, 1.0);
                vWorldPos = worldPosition.xyz;
                gl_Position = projectionMatrix * modelViewMatrix * worldPosition;
            }
        `;

        const grassFragmentShader = `
            varying vec2 vUv;
            varying vec3 vNormal;
            varying vec3 vWorldPos;
            uniform vec3 uBaseColor;
            uniform vec3 uTipColor;
            uniform float uTime;

            void main() {
                vec3 color = mix(uBaseColor, uTipColor, vUv.y);
                float pulse = sin(vWorldPos.x * 1.5 + vWorldPos.z * 1.5 + uTime * 3.0) * 0.5 + 0.5;
                color += vec3(pulse * 0.3, 0.0, pulse * 0.5);

                vec3 lightDir = normalize(vec3(0.5, 1.0, 0.5));
                float diff = max(dot(vNormal, lightDir), 0.5);
                
                gl_FragColor = vec4(color * diff, 1.0);
            }
        `;

        function createRobot(pbrMaterial, jointMat) {
            const robotGroup = new THREE.Group();

            const head = new THREE.Mesh(new THREE.SphereGeometry(0.6, 32, 32), pbrMaterial);
            head.position.y = 2.1;
            head.scale.set(1.1, 0.9, 1);
            head.castShadow = true;
            robotGroup.add(head);

            const eyeMat = new THREE.MeshStandardMaterial({ 
                color: 0x00ffff, 
                roughness: 0.1, 
                metalness: 0.9, 
                emissive: 0x00ffff,
                emissiveIntensity: 0.8 
            });
            const eyeGeo = new THREE.SphereGeometry(0.2, 16, 16);
            const eyeLeft = new THREE.Mesh(eyeGeo, eyeMat);
            eyeLeft.position.set(0.25, 2.1, 0.5);
            const eyeRight = new THREE.Mesh(eyeGeo, eyeMat);
            eyeRight.position.set(-0.25, 2.1, 0.5);
            robotGroup.add(eyeLeft, eyeRight);

            const antennaStem = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, 0.4, 16), jointMat);
            antennaStem.position.set(0, 2.8, 0);
            const antennaBall = new THREE.Mesh(
                new THREE.SphereGeometry(0.12, 16, 16), 
                new THREE.MeshStandardMaterial({ color: 0xff0055, emissive: 0xff0055, emissiveIntensity: 1.0 })
            );
            antennaBall.position.set(0, 3.0, 0);
            robotGroup.add(antennaStem, antennaBall);

            const body = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.55, 0.9, 32), pbrMaterial);
            body.position.y = 1.25;
            body.castShadow = true;
            robotGroup.add(body);

            const limbGeo = new THREE.CylinderGeometry(0.08, 0.08, 0.4, 16);
            const armL = new THREE.Mesh(limbGeo, jointMat); armL.position.set(0.6, 1.3, 0); armL.rotation.z = -0.3;
            const armR = new THREE.Mesh(limbGeo, jointMat); armR.position.set(-0.6, 1.3, 0); armR.rotation.z = 0.3;
            const legL = new THREE.Mesh(limbGeo, jointMat); legL.position.set(0.25, 0.6, 0);
            const legR = new THREE.Mesh(limbGeo, jointMat); legR.position.set(-0.25, 0.6, 0);
            robotGroup.add(armL, armR, legL, legR);

            const footGeo = new THREE.SphereGeometry(0.22, 16, 16);
            const footL = new THREE.Mesh(footGeo, pbrMaterial); footL.position.set(0.25, 0.3, 0); footL.scale.set(1, 0.6, 1.3); footL.castShadow = true;
            const footR = new THREE.Mesh(footGeo, pbrMaterial); footR.position.set(-0.25, 0.3, 0); footR.scale.set(1, 0.6, 1.3); footR.castShadow = true;
            robotGroup.add(footL, footR);

            return robotGroup;
        }

        function createFerrisWheel() {
            ferrisWheelGroup = new THREE.Group();
            const neonMat = new THREE.MeshStandardMaterial({ color: 0x00f0ff, emissive: 0x00f0ff, emissiveIntensity: 0.8, metalness: 0.8, roughness: 0.2 });
            const structureMat = new THREE.MeshStandardMaterial({ color: 0x222233, metalness: 0.9, roughness: 0.2 });

            const standGeo = new THREE.CylinderGeometry(0.15, 0.2, 12);
            const stand1 = new THREE.Mesh(standGeo, structureMat);
            stand1.position.set(-2, 5, 0);
            stand1.rotation.z = -0.3;
            const stand2 = new THREE.Mesh(standGeo, structureMat);
            stand2.position.set(2, 5, 0);
            stand2.rotation.z = 0.3;
            ferrisWheelGroup.add(stand1, stand2);

            const wheelRim = new THREE.Mesh(new THREE.TorusGeometry(5, 0.12, 16, 64), neonMat);
            wheelRim.position.y = 9;

            const numSpokes = 8;
            for (let i = 0; i < numSpokes; i++) {
                const angle = (i / numSpokes) * Math.PI * 2;
                const spoke = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 10), neonMat);
                spoke.rotation.z = angle;
                wheelRim.add(spoke);

                const car = new THREE.Mesh(
                    new THREE.BoxGeometry(0.8, 0.8, 0.8),
                    new THREE.MeshStandardMaterial({ color: 0xff0055, emissive: 0xff0055, emissiveIntensity: 0.6, roughness: 0.3 })
                );
                car.position.set(Math.cos(angle) * 5, Math.sin(angle) * 5, 0);
                wheelRim.add(car);
                ferrisCars.push(car);
            }

            ferrisWheelGroup.add(wheelRim);
            ferrisWheelGroup.userData.wheel = wheelRim;
            ferrisWheelGroup.position.set(0, 0, -12);
            return ferrisWheelGroup;
        }

        function createCarousel() {
            carouselGroup = new THREE.Group();
            const roofMat = new THREE.MeshStandardMaterial({ color: 0xff0055, roughness: 0.3, metalness: 0.5 });

            const base = new THREE.Mesh(new THREE.CylinderGeometry(4, 4.2, 0.5, 32), roofMat);
            base.position.y = 0.25;
            const roof = new THREE.Mesh(new THREE.ConeGeometry(4.5, 2, 32), roofMat);
            roof.position.y = 4.5;
            carouselGroup.add(base, roof);

            const centerPole = new THREE.Mesh(
                new THREE.CylinderGeometry(0.8, 0.8, 4, 16),
                new THREE.MeshStandardMaterial({ color: 0x00f0ff, emissive: 0x00f0ff, emissiveIntensity: 0.8 })
            );
            centerPole.position.y = 2.25;
            carouselGroup.add(centerPole);

            carouselGroup.position.set(-14, 0, -5);
            return carouselGroup;
        }

        function init() {
            scene = new THREE.Scene();

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
            camera.position.set(0, 5, 15);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.2;
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            document.body.appendChild(renderer.domElement);

            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.target.set(0, 2, 0);

           
            bgShaderMaterial = new THREE.ShaderMaterial({
                vertexShader: bgVertexShader,
                fragmentShader: bgFragmentShader,
                uniforms: {
                    uTime: { value: 0 },
                    uColorSkyTop: { value: new THREE.Color(0x0a001a) },     
                    uColorSkyBottom: { value: new THREE.Color(0x00112c) },  
                    uNeonGlow: { value: new THREE.Color(0x00f0ff) }       
                },
                depthWrite: false,
                depthTest: false
            });

            const bgPlane = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), bgShaderMaterial);
            const bgScene = new THREE.Scene();
            const bgCamera = new THREE.Camera();
            bgScene.add(bgPlane);

            scene.userData.bgScene = bgScene;
            scene.userData.bgCamera = bgCamera;
            renderer.autoClear = false;

          
            const hemisphereLight = new THREE.HemisphereLight(0x00ffff, 0xff0055, 1.2);
            scene.add(hemisphereLight);

            dirLight = new THREE.DirectionalLight(0xffffff, 2.0);
            dirLight.position.set(8, 12, 8);
            dirLight.castShadow = true;
            dirLight.shadow.mapSize.width = 2048;
            dirLight.shadow.mapSize.height = 2048;
            scene.add(dirLight);

       
            const floorGeo = new THREE.PlaneGeometry(60, 60);
            const floorPBRMaterial = new THREE.MeshStandardMaterial({
                color: 0x050510, 
                roughness: 0.3,
                metalness: 0.7
            });
            const floor = new THREE.Mesh(floorGeo, floorPBRMaterial);
            floor.rotation.x = -Math.PI / 2;
            floor.receiveShadow = true;
            scene.add(floor);

            
            const grassBladeGeo = new THREE.PlaneGeometry(0.1, 0.7, 1, 4);
            grassBladeGeo.translate(0, 0.35, 0); 

            grassMaterial = new THREE.ShaderMaterial({
                vertexShader: grassVertexShader,
                fragmentShader: grassFragmentShader,
                uniforms: {
                    uTime: { value: 0 },
                    uBaseColor: { value: new THREE.Color(0x220033) }, 
                    uTipColor: { value: new THREE.Color(0x00f0ff) }  
                },
                side: THREE.DoubleSide
            });

            const count = 10000; 
            const instancedGrass = new THREE.InstancedMesh(grassBladeGeo, grassMaterial, count);
            const dummy = new THREE.Object3D();

            for (let i = 0; i < count; i++) {
                const x = (Math.random() - 0.5) * 50;
                const z = (Math.random() - 0.5) * 50;
                
                dummy.position.set(x, 0, z);
                dummy.rotation.y = Math.random() * Math.PI;
                dummy.scale.set(0.8 + Math.random() * 0.5, 0.7 + Math.random() * 0.6, 1);
                dummy.updateMatrix();
                
                instancedGrass.setMatrixAt(i, dummy.matrix);
            }
            scene.add(instancedGrass);

        
            modelPBRMaterial = new THREE.MeshStandardMaterial({ color: 0xff0055, roughness: 0.15, metalness: 0.85 });
            armyPBRMaterial = new THREE.MeshStandardMaterial({ color: 0x00f0ff, roughness: 0.2, metalness: 0.8 });
            const metalJointMat = new THREE.MeshStandardMaterial({ color: 0x111122, roughness: 0.1, metalness: 0.95 });

            commanderRobot = createRobot(modelPBRMaterial, metalJointMat);
            commanderRobot.position.set(0, 0, 2);
            commanderRobot.scale.set(1.2, 1.2, 1.2);
            scene.add(commanderRobot);

            const rows = 4;
            const cols = 6;
            const spacingX = 2.5;
            const spacingZ = 2.5;

            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    const soldier = createRobot(armyPBRMaterial, metalJointMat);
                    const x = (c - (cols - 1) / 2) * spacingX;
                    const z = - (r * spacingZ) - 1;
                    soldier.position.set(x, 0, z);
                    soldier.rotation.y = (Math.random() - 0.5) * 0.1;
                    scene.add(soldier);
                    armyMembers.push(soldier);
                }
            }

            scene.add(createFerrisWheel());
            scene.add(createCarousel());

            
            const gui = new GUI();
            gui.title('Amusement Park Control');

            const envFolder = gui.addFolder('Background Shader');
            const envParams = {
                skyTop: '#' + bgShaderMaterial.uniforms.uColorSkyTop.value.getHexString(),
                skyBottom: '#' + bgShaderMaterial.uniforms.uColorSkyBottom.value.getHexString(),
                neonGlow: '#' + bgShaderMaterial.uniforms.uNeonGlow.value.getHexString()
            };
            envFolder.addColor(envParams, 'skyTop').name('Sky Top Color').onChange(v => bgShaderMaterial.uniforms.uColorSkyTop.value.set(v));
            envFolder.addColor(envParams, 'skyBottom').name('Sky Horizon Color').onChange(v => bgShaderMaterial.uniforms.uColorSkyBottom.value.set(v));
            envFolder.addColor(envParams, 'neonGlow').name('Neon Bloom Color').onChange(v => bgShaderMaterial.uniforms.uNeonGlow.value.set(v));

            const commanderFolder = gui.addFolder('Commander Robot');
            commanderFolder.addColor({ color: modelPBRMaterial.color.getHex() }, 'color').name('Color').onChange(v => modelPBRMaterial.color.setHex(v));
            commanderFolder.add(modelPBRMaterial, 'roughness', 0, 1, 0.01);
            commanderFolder.add(modelPBRMaterial, 'metalness', 0, 1, 0.01);

            window.addEventListener('resize', onWindowResize);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const elapsedTime = clock.getElapsedTime();

           
            if (bgShaderMaterial) bgShaderMaterial.uniforms.uTime.value = elapsedTime;
            if (grassMaterial) grassMaterial.uniforms.uTime.value = elapsedTime;

            
            if (ferrisWheelGroup && ferrisWheelGroup.userData.wheel) {
                ferrisWheelGroup.userData.wheel.rotation.z = elapsedTime * 0.3;
                ferrisCars.forEach(car => {
                    car.rotation.z = -elapsedTime * 0.3;
                });
            }

            if (carouselGroup) {
                carouselGroup.rotation.y = elapsedTime * 0.5;
            }

         
            if (commanderRobot) {
                commanderRobot.rotation.y += 0.008;
                commanderRobot.position.y = Math.sin(elapsedTime * 2.0) * 0.1;
            }

            armyMembers.forEach((soldier, idx) => {
                const antenna = soldier.children[2];
                if (antenna) {
                    antenna.rotation.z = Math.sin(elapsedTime * 4.0 + idx) * 0.15;
                }
            });

            controls.update();

          
            renderer.clear();
            renderer.render(scene.userData.bgScene, scene.userData.bgCamera);
            renderer.render(scene, camera);
        }

        init();
        animate();
    </script>
</body>
</html>
